# REQUIRED
# Kind can be one of:
# - breaking-change: a change to previously-documented behavior
# - deprecation: functionality that is being removed in a later release
# - bug-fix: fixes a problem in a previous version
# - enhancement: extends functionality but does not break or fix existing behavior
# - feature: new functionality
# - known-issue: problems that we are aware of in a given version
# - security: impacts on the security of a product or a user’s deployment.
# - upgrade: important information for someone upgrading from a prior version
# - other: does not fit into any of the other categories
kind: feature

# REQUIRED for all kinds
# Change summary; a 80ish characters long description of the change.
summary: Add a preview of agent.limits.cpu to limit the CPU use of Elastic Agent and its components on Linux with systemd

# REQUIRED for breaking-change, deprecation, known-issue
# Long description; in case the summary is not enough to describe the change
# this field accommodate a description without length limits.
description: "This is a preview. It is off by default and is turned on with the internal setting agent.internal.limits.cpu.enabled: true, which is read when the Agent starts. With the setting off, agent.limits.cpu is only validated, nothing is enforced, and nothing about the limit is reported. The new optional setting agent.limits.cpu is a whole number from 0 to 100. It is the share of the CPU capacity of the host that Elastic Agent and the components that it starts as child processes may use together. The value 0, or no value, means that no limit is set. On Linux hosts with systemd and cgroup v2, a root service sets a runtime CPUQuota on its own unit over D-Bus, and removes it when the limit is turned off or the Agent stops. Components are held back until the limit is verified. The status of the limit is shown in elastic-agent status, in the diagnostics and in Fleet. Other platforms, containers, and Agents that do not run as a root systemd service report that the limit is not supported. An invalid value rejects the policy or configuration, as an invalid agent.limits.go_max_procs does."

